name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # Trusted publishing (OIDC) en npm, sin NPM_TOKEN

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # Sin caché: en un build que publica, un caché envenenado llegaría a npm.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      # Con changesets pendientes abre o actualiza el PR "Version Packages".
      # Sin changesets, `pnpm release` (build + exports + tamaño) deja en el
      # staging de npm las versiones nuevas y crea sus tags; nada llega a npm
      # hasta que un maintainer lo aprueba con 2FA (npmjs.com → Staged Packages).
      # Trusted publishing: pnpm cambia el token OIDC de GitHub por uno temporal
      # de npm y agrega provenance. No hay NPM_TOKEN.
      # Tras aprobar el widget, correr a mano el workflow "Verificar jsDelivr".
      - name: Versionar o enviar a staging
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
