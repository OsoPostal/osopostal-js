name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Rutas de package.json (tipos y bundles)
        run: pnpm check:exports
      - run: pnpm typecheck
      - run: pnpm test
      - name: Presupuesto de tamaño (< 10 KB gzip)
        run: pnpm size
      - run: pnpm exec playwright install --with-deps chromium firefox
      - name: E2E contra el mock de la API
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
